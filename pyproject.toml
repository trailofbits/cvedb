[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "C90", "PLR0911", "PLR0912", "PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-branches = 12
max-returns = 6
max-args = 5

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
filterwarnings = ["error"]
