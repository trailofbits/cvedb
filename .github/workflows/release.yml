name: release

on:
  release:
    types: [published]

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release identity and default-branch ancestry
        run: python3 scripts/verify_release.py

  validation:
    needs: guard
    permissions:
      contents: read
    # actionlint 1.7.12 rejects $/; this documented local call still resolves to the event commit.
    uses: ./.github/workflows/tests.yml # zizmor: ignore[self-repository]

  build:
    needs: [guard, validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: false
      - name: Install locked dependencies
        run: |
          uv lock --check
          uv sync --frozen
      - name: Build and verify release distributions
        run: uv run --frozen python -m scripts.check_dist --out-dir dist
      - name: Upload verified archives
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [validation, build]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cvedb
    permissions:
      id-token: write
    steps:
      - name: Download the verified archives from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          digest-mismatch: error
      - name: Publish to PyPI through OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
