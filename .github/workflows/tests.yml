name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions: {}

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install locked dependencies
        run: |
          uv lock --check
          uv sync --frozen
      - name: Run offline tests with warnings as errors
        run: uv run --frozen pytest -q

  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: false
      - name: Install locked dependencies
        run: |
          uv lock --check
          uv sync --frozen
      - name: Run repository checks
        run: uv run --frozen prek run --all-files
      - name: Verify source and wheel distributions
        run: uv run --frozen python -m scripts.check_dist
