files: >-
  (?x)^(
    cvedb/(cpe|cve|nvd|schemas|search|sql)\.py
    |test/test_(cpe_matching|applicability|storage|nvd)\.py
  )$
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Lint correctness fixes
        language: system
        entry: .venv/bin/ruff check
      - id: ruff-format
        name: Check correctness formatting
        language: system
        entry: .venv/bin/ruff format --check
      - id: ty
        name: Check correctness types
        language: system
        entry: .venv/bin/ty check --error-on-warning
