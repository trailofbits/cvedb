repos:
  - repo: local
    hooks:
      - id: ruff
        name: Lint Python
        language: system
        entry: uv run --frozen ruff check
        types: [python]
      - id: ruff-format
        name: Check Python formatting
        language: system
        entry: uv run --frozen ruff format --check
        types: [python]
      - id: ty
        name: Check correctness types
        language: system
        entry: uv run --frozen ty check --error-on-warning
        files: >-
          (?x)^(
            cvedb/(cpe|cve|nvd|schemas|search|sql|dates|db|feed|cli|__main__)\.py
            |test/test_(cpe_matching|applicability|storage|nvd|search|search_dates
            |updates|contexts|feeds|transport|cli|packaging)\.py
            |test/feed_fixtures\.py
            |scripts/.*\.py
          )$
      - id: pytest
        name: Run offline Python tests
        language: system
        entry: uv run --frozen pytest -q
        pass_filenames: false
        files: ^(cvedb/|test/|scripts/|pyproject\.toml|uv\.lock)
      - id: shellcheck
        name: Check shell scripts
        language: system
        entry: uv run --frozen shellcheck
        types: [shell]
      - id: shfmt
        name: Check shell formatting
        language: system
        entry: uv run --frozen shfmt -i 2 -d
        types: [shell]
      - id: actionlint
        name: Check GitHub Actions
        language: system
        entry: uv run --frozen actionlint
        files: ^\.github/workflows/.*\.ya?ml$
      - id: zizmor
        name: Audit GitHub Actions
        language: system
        entry: uv run --frozen zizmor --offline --min-severity low --min-confidence low
        files: ^\.github/workflows/.*\.ya?ml$
